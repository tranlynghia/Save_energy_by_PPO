environment:
  dt_hours: 0.25
  timestep_minutes: 15
  max_steps_per_episode: 96
  target_temp: 25.0

physics:
  thermal:
    model: "rc_1r1c_plus_gains"
    thermal_resistance: 2.5
    thermal_capacitance: 12.0
    cop_nominal: 2.5
    cop_min: 1.0
    cop_degradation_k: 0.02
    solar_gain_coeff: 0.5
    internal_gain_base_kw: 0.1
    internal_gain_fraction: 0.2
    infiltration_coeff: 0.05
    comfort_low: 22.0
    comfort_high: 26.0
    severe_overheat_threshold: 27.0

  battery:
    capacity_kwh: 10.0
    max_charge_kw: 5.0
    max_discharge_kw: 5.0
    min_soc: 0.05
    max_soc: 0.95
    healthy_soc_low: 0.3
    healthy_soc_high: 0.8
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    temp_min_c: 0.0
    temp_max_c: 45.0

  pv:
    capacity_kw: 5.0
    derate_factor: 0.85

reward:
  cost_normalization: 5000.0
  reward_min: -20.0
  reward_max: 5.0
  peak_limit_kw: 4.0

  weights:
    saving: 1.0
    comfort: 2.0
    severe: 4.0
    peak: 0.5
    degradation: 0.1
    soc_health: 1.0
    smooth: 0.05
    switch: 0.05

  bonuses:
    comfort_in_zone: 0.2
    soc_healthy: 0.05

  battery:
    healthy_soc_low: 0.3
    healthy_soc_high: 0.8

pricing:
  tou_normal: 1987.0
  tou_off_peak: 1300.0
  tou_peak: 3640.0

data:
  weather_source: "demo"
  weather_file: null
  location: "Da Nang demo profile"

training:
  seed: 42
  num_envs: 8
  total_timesteps: 100000
  checkpoint_freq: 10000

ppo:
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 2048
  ent_coef: 0.01
  n_steps: 2048
  clip_range: 0.2
