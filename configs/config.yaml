environment:
  timestep_minutes: 15
  max_power_kw: 160.0          # Tòa nhà: tải đỉnh ~200kW, giới hạn 160kW để ép peak shaving
  target_temp: 25.0
  max_steps_per_episode: 96

physics:
  pv_capacity_kw: 200.0         # Tòa nhà văn phòng: ~200kWp PV
  thermal:
    thermal_resistance: 0.05    # Tòa nhà lớn: R thấp hơn (truyền nhiệt nhanh qua diện tích lớn)
    thermal_capacitance: 200.0  # Tòa nhà lớn: C cao hơn (khối tích lớn, quán tính nhiệt cao)
    hvac_efficiency: 2.5
    # --- Phase 4: Advanced Thermal ---
    window_area_m2: 240.0       # Tòa nhà văn phòng: diện tích kính lớn
    shgc: 0.25
    occupancy_heat_kw: 0.1
    cop_degradation_k: 0.03
    cop_t_ref: 10.0

  battery:
    capacity_kwh: 400.0         # BESS quy mô tòa nhà
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    max_charge_power_kw: 120.0
    max_discharge_power_kw: 120.0
    min_soc: 0.1
    max_soc: 1.0

ppo:
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 2048
  ent_coef: 0.01
  n_steps: 2048
  clip_range: 0.2

pricing:
  tou_normal: 1734.0   # VNĐ/kWh
  tou_off_peak: 1133.0 # VNĐ/kWh
  tou_peak: 3171.0     # VNĐ/kWh
  tier_3_flat: 2271.0  # VNĐ/kWh (nhà trọ)

reward:
  w_eco: 1.0
  w_peak: 2.0                  # Giảm từ 5.0 -> 2.0 (vẫn đủ để áp lực nhưng không đè bẹp cost)
  w_comfort: 2.0               # Giảm mạnh từ 25.0 -> 2.0 để cân bằng với cost đã normalize
  w_task: 2.0                  # Giảm từ 15.0 -> 2.0

stochastic:
  use_real_citylearn_data: true
  sensor_noise_sigma: 0.2
  degradation_weights:
    alpha: 2.0   # Tăng từ 0.5 -> 2.0 (phạt mạnh việc sạc/xả cường độ cao)
    beta: 1.0    # Phạt hao mòn do căng SOC (neo ở 50%)

training:
  seed: 42
  num_envs: 8
  total_timesteps: 100000
  checkpoint_freq: 10000

# --- Phase 5: Forecasting System ---
forecast:
  pv_noise_sigma: 80.0       # W/kW — sai số dự báo PV
  load_noise_sigma: 0.4      # kW  — sai số dự báo tải
  occ_noise_sigma: 0.05      # xác suất — sai số dự báo occupancy
  # Để trống = dùng statistical fallback (không cần pre-training)
  pv_model_path: ""
  load_model_path: ""
  occ_model_path: ""
